<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Word pronunciation</title><style>body{font-family:system-ui,Arial,sans-serif;max-width:540px;margin:10vh auto;padding:24px;text-align:center;color:#17212f}h1{font-size:2.2rem;overflow-wrap:anywhere}button{background:#183c70;color:white;border:0;border-radius:14px;padding:17px 40px;font-size:1.3rem;cursor:pointer}p{color:#566}a{color:#183c70}</style></head><body><h1 id="word"></h1><button id="play">▶ Play pronunciation</button><p id="status">American English pronunciation. Sound depends on the voice installed on your phone.</p><p><a href="index.html">All words</a></p><script>
const allowed=["literate", "resilience", "obsolete", "scrutinize", "attribute", "pervasive", "vanity", "plausible", "entail", "hospitable", "diversify", "nominate", "bureaucracy", "undermine", "compelling", "imperative", "adjacent", "carnivorous", "demolish", "empathetic", "flammable", "incur", "misdeed", "prophecy", "reimburse", "secrete", "tribute", "watershed", "affection", "compliant", "discern", "sanction", "metaphysical", "aversion", "taint", "diagnose"];
const params=new URLSearchParams(location.search);const word=(params.get('word')||'').toLowerCase();
const title=document.querySelector('#word'),button=document.querySelector('#play'),status=document.querySelector('#status');
if(!allowed.includes(word)){title.textContent='Word not found';button.disabled=true;}else{title.textContent=word;}
button.onclick=()=>{if(!('speechSynthesis' in window)){status.textContent='Speech playback is not supported in this browser.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.85;const voices=speechSynthesis.getVoices();const us=voices.filter(v=>v.lang.toLowerCase().startsWith('en-us'));const female=us.find(v=>/female|samantha|zira|jenny|aria|ava|allison|susan|victoria/i.test(v.name));if(female||us[0])u.voice=female||us[0];speechSynthesis.speak(u);};
</script></body></html>
